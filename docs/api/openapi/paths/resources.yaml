resources:
  get:
    tags: [Resource]
    summary: List resources
    operationId: listResources
    responses:
      '200':
        $ref: '../components/responses/common.yaml#/SuccessResponse'
  post:
    tags: [Resource]
    summary: Create a resource
    operationId: createResource
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/resource.yaml#/ResourceCreate'
    responses:
      '201':
        $ref: '../components/responses/common.yaml#/SuccessResponse'
resource_by_id:
  get:
    tags: [Resource]
    summary: Get a resource by ID
    operationId: getResource
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        $ref: '../components/responses/common.yaml#/SuccessResponse'
