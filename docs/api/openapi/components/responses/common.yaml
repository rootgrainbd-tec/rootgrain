SuccessResponse:
  description: Successful operation
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: boolean
          data:
            type: object
          metadata:
            $ref: '../schemas/common.yaml#/ResponseMetadata'
          timestamp:
            type: string
            format: date-time
ErrorResponse:
  description: Error occurred
  content:
    application/json:
      schema:
        type: object
        properties:
          code:
            type: string
          message:
            type: string
          details:
            type: object
          timestamp:
            type: string
            format: date-time
